[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "samplot"
# the version is samplot.__version__ (samplot/__init__.py)
dynamic = ["version"]
description = "plotting package for genomic structural variation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jonathan Belyeu", email = "jrbelyeu@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "matplotlib>=3.5",
    "numpy>=1.20",
    "pysam>=0.19",
    "Jinja2",
]

[project.urls]
Homepage = "https://github.com/ryanlayer/samplot"

[project.scripts]
samplot = "samplot.__main__:main"

[tool.setuptools]
packages = ["samplot"]

[tool.setuptools.dynamic]
version = { attr = "samplot.__version__" }

[tool.setuptools.package-data]
# report template and the bundled gene tracks (see scripts/make_gene_track.py)
samplot = ["templates/*.html", "data/*.bed.gz", "data/*.bed.gz.tbi"]
